# --- BAD_REQUEST — inverted price band (I-09) ---------------------------------

mutation RegisterMasterLeasingContract_InvertedPriceBand($input: RegisterMasterLeasingContractInput!) {
  registerMasterLeasingContract(input: $input) {
    masterLeasingContractId
    status
    configurationVersion
  }
}

