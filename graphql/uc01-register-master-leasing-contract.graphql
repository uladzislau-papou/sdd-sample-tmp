# UC01 — RegisterMasterLeasingContract
#
# Worked examples of the operation defined in
# documentation/use-cases/uc01-register-master-leasing-contract.spec.md § 9,
# exercised against the GraphQL endpoint (default: /contractmanagement/v1/graphql).
#
# Every classification named in the use-case spec's error table has a matching
# operation here — currently just BAD_REQUEST (UC01 has no NOT_FOUND or CONFLICT
# path; see § 8 "Deliberately absent: referential checks").

# --- Success -----------------------------------------------------------------

mutation RegisterMasterLeasingContract($input: RegisterMasterLeasingContractInput!) {
  registerMasterLeasingContract(input: $input) {
    masterLeasingContractId
    status
    configurationVersion
  }
}

