name: build

# Runs the canonical quality gates from documentation/test.definition.md section 7.
# ADR 0007 exists because these rules were previously enforced only when a human or an
# agent remembered to check them; ADR 0014 generalises that to every class of rule.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pinned explicitly rather than inherited from the runner default. ADR 0010 keeps
      # ADR 0006's reasoning on this point: the toolchain and the environment diverging is
      # the drift that ADR fixed, and a runner default is an environment we do not control.
      #
      # The vendor pin that ADR 0006 also required is deliberately gone (ADR 0010): it
      # existed because Java 25 early-access builds reported the same language version as
      # the release, and that ambiguity does not exist for a long-standing LTS.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` depends on `check`, which covers spotlessCheck, detekt, the fast tests and
      # integrationTest. Run explicitly anyway, in that order, so a failure names which
      # gate failed in the step list rather than inside one opaque task graph.
      - name: Fast tests
        run: ./gradlew clean test

      # Needs Docker for Testcontainers. Available on ubuntu-latest; a self-hosted runner
      # without it will fail here rather than silently skip, which is the intent —
      # test.definition.md section 7 gate 2 is not optional.
      - name: Integration tests
        run: ./gradlew integrationTest

      - name: Style and static analysis
        run: ./gradlew spotlessCheck detekt

      - name: Build
        run: ./gradlew build

      # A green suite is not evidence that a gate read anything. Three of them can pass
      # while inspecting an empty set:
      #
      #   - ArchUnit imports zero classes if its importer cannot read the bytecode version,
      #     and reports success (this bit the project once, before 1.4.1 on Java 25);
      #   - ContextRegistryTest parses a markdown table, and a restyled table parses to
      #     zero rows;
      #   - SpecCitationsTest scans documentation/, and a wrong working directory finds no
      #     files.
      #
      # Each guards itself internally with a non-empty assertion. This step is the outer
      # check that they ran at all, because a test that was never executed cannot assert
      # anything about itself.
      - name: Assert the enforcement suites actually ran
        run: |
          missing=0
          for suite in DependencyRulesTest ClassRoleRulesTest ContextRegistryTest \
                       SpecCitationsTest DocumentationLinksTest; do
            if ! grep -rqs "$suite" app/build/test-results/test/; then
              echo "::error::No $suite results found — that enforcement suite did not run."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::See documentation/adr/0014-quality-gates-are-executable.adr.md"
            exit 1
          fi
          echo "All enforcement suites ran."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
