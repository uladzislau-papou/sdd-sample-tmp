# Test datasource: the disposable `test_db` service in docker-compose/docker-compose.yaml,
# never the dev database. Integration tests truncate between cases.
#
# Tests that need this profile declare @ActiveProfiles("test"); tests that do not need a
# database must not start one (test.definition.md § 1.3). Integration tests additionally
# guard on PostgresAvailability and skip themselves when the server is unreachable, so a
# clone with no Docker still gets a green domain and use-case suite.
spring.datasource.url=${TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5433/contract_management_test}
spring.datasource.username=${TEST_DATASOURCE_USERNAME:contract_management}
spring.datasource.password=${TEST_DATASOURCE_PASSWORD:contract_management}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
