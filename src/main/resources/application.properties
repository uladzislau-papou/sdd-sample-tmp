spring.application.name=contract-management

# GraphQL is the only inbound adapter (adr/0008-graphql-only-inbound-adapter.adr.md).
# There is no REST controller in this application and no springdoc.
spring.graphql.http.path=${GRAPHQL_PATH:/contractmanagement/v1/graphql}
spring.graphql.schema.locations=classpath:graphql/,classpath:graphql/masterleasing/,classpath:graphql/individualleasing/
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:true}

# Logging
logging.level.root=INFO
logging.level.com.jobradleasing=DEBUG

# .env file configuration, so local development needs no exported environment
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/contract_management}
spring.datasource.username=${DATASOURCE_USERNAME:contract_management}
spring.datasource.password=${DATASOURCE_PASSWORD:contract_management}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema. technical.spec.md forbids ORM-generated DDL, so
# ddl-auto is validate and never update: Hibernate checks that the schema Flyway
# produced matches the mappings, and fails startup when it does not.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
