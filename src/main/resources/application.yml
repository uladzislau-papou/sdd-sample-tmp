spring:
  application:
    name: contract-management-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contract_management}
    username: ${DB_USER:service}
    password: ${DB_PASSWORD:service}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate must never alter it: implicit schema
      # generation is the drift ADR 0001 rules out.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  graphql:
    graphiql:
      enabled: true

# Operational baseline, adr/0021. Which endpoints are public in production is a deployment
# concern; this exposes the minimum the platform's collectors read.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        # Off unless a collector is configured. An exporter that retries against nothing
        # fills the log with failures that look like an incident.
        enabled: ${OTLP_ENABLED:false}
        url: ${OTLP_URL:http://localhost:4318/v1/metrics}
