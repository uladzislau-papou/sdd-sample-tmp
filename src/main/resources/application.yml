spring:
  application:
    name: service-template
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/service_template}
    username: ${DB_USER:service}
    password: ${DB_PASSWORD:service}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate must never alter it: implicit schema
      # generation is the drift ADR 0001 rules out.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  graphql:
    graphiql:
      enabled: true
