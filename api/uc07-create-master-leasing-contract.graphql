# UC07 — CreateMasterLeasingContract over GraphQL.
#
# There is deliberately **no** `uc07-*.http` companion. GraphQL is the only transport in the
# MVP (adr/0020-graphql-as-the-only-transport.adr.md), so unlike UC01 this use case has one
# file and not two — REST arrives with the first machine consumer, and springdoc with it.
#
# **This file carries a load the other api/ files do not.** uc07 § 3 derives the response
# shape rather than sourcing it: no JCM page specifies one. That derivation cannot be
# falsified by a domain test, because this service has no read side and the payload returns
# identifiers only — so § 3 makes *this file* accountable for the shape instead. If the
# derivation is wrong, it shows here first.
#
# Run against http://localhost:8080/graphql — GraphiQL is enabled in development at
# http://localhost:8080/graphiql
#
# Note on the decimal fields: creditLimit, the two percentages and the price bounds are
# `String` because GraphQL's Float is a double-precision binary float and cannot represent
# money exactly, and this service declares no decimal scalar. See mlc.graphqls.
#
# SDD: documentation/use-cases/uc07-create-master-leasing-contract.spec.md § 9

# --- Happy path: every field, mandatory and optional alike. -------------------------------
# Returns the contract's identity, ACTIVE (PD-07), and the identity and version of the terms
# created with it. `configurationVersion` is always 1 on creation.
mutation CreateMasterLeasingContract {
  createMasterLeasingContract(input: {
    employerId: "EMP-4711"
    lessorId: "LESSOR-1"
    partnerNumber: "PN-90210"
    owner: "contract-operations"

    creditLimit: "50000.00"
    contractType: "salary-sacrifice-leasing"
    currency: "EUR"
    eligibleEmployees: 250

    salesChannel: "direct"
    groupJointLiability: true
    returnQuotaPercentage: "10"
    earlyClaimFeePercentage: "2.5"
    earlyClaimWindowMonths: 12
    noticePeriodRule: "3-months-to-quarter-end"
    paymentTerms: "NET30"
    priceRangeMin: "749"
    priceRangeMax: "11000"
    calculationBasis: "sale-price-plus-shipping"
    servicePackageOptions: ["basic", "comfort"]
    servicePackageVersion: 3
    categoriesEditableInPortal: true
  }) {
    masterLeasingContractId
    status
    configurationId
    configurationVersion
  }
}

# --- Happy path, minimal: only the six fields PD-01 makes mandatory. ----------------------
# This request is the transport-level statement of **AC-08**. It is here rather than only in
# a unit test because PD-01 is a provisional decision of ours — the JCM data model page lists
# every field and states no optionality anywhere — so "these six and no others" is the claim
# most likely to be corrected by an answer from the project. When it is, this request is
# what stops compiling first, in the sense that matters: a client author runs it and it fails.
mutation CreateMasterLeasingContractMinimal {
  createMasterLeasingContract(input: {
    employerId: "EMP-4712"
    lessorId: "LESSOR-1"
    creditLimit: "10000"
    contractType: "salary-sacrifice-leasing"
    currency: "CHF"
    eligibleEmployees: 5
  }) {
    masterLeasingContractId
    status
    configurationId
    configurationVersion
  }
}

# --- Error: BAD_REQUEST — blank employer reference (AC-03). -------------------------------
# The one rule in § 2.3 argued from the sources rather than decided provisionally: this
# contract is the framework agreement established *with an employer*, so an instance without
# one is not the thing being modelled.
mutation CreateMasterLeasingContractBlankEmployer {
  createMasterLeasingContract(input: {
    employerId: " "
    lessorId: "LESSOR-1"
    creditLimit: "10000"
    contractType: "salary-sacrifice-leasing"
    currency: "EUR"
    eligibleEmployees: 5
  }) {
    masterLeasingContractId
    status
  }
}

# --- Error: BAD_REQUEST — price range inverted (AC-07). -----------------------------------
# PD-10. Deliberately one *named* rule and not "input is validated": the real validation
# matrix does not exist yet (the MVP page's risk 1 records that the linkage rules are not
# modelled anywhere, and that the measure against it is to build the matrix). Every rule in
# § 2.3 is a plausibility check we invented.
mutation CreateMasterLeasingContractInvertedPriceRange {
  createMasterLeasingContract(input: {
    employerId: "EMP-4711"
    lessorId: "LESSOR-1"
    creditLimit: "10000"
    contractType: "salary-sacrifice-leasing"
    currency: "EUR"
    eligibleEmployees: 5
    priceRangeMin: "11000"
    priceRangeMax: "749"
  }) {
    masterLeasingContractId
    status
  }
}

# --- Error: BAD_REQUEST — one price bound without the other. ------------------------------
# The § 2.3 rule the implementation exposed rather than the spec anticipating it: the input
# carries two nullable bounds while the domain carries one nullable range, so the mapping has
# four combinations and only two had a rule. A single bound describes no band of prices.
mutation CreateMasterLeasingContractHalfPriceRange {
  createMasterLeasingContract(input: {
    employerId: "EMP-4711"
    lessorId: "LESSOR-1"
    creditLimit: "10000"
    contractType: "salary-sacrifice-leasing"
    currency: "EUR"
    eligibleEmployees: 5
    priceRangeMin: "749"
  }) {
    masterLeasingContractId
    status
  }
}

# --- Error: BAD_REQUEST — currency is not a three-letter code. ----------------------------
# PD-10, checked as a shape and not against a currency table. A table would conflate a
# malformed input, which is ours to reject, with a well-formed code we do not support, which
# is a business question.
mutation CreateMasterLeasingContractBadCurrency {
  createMasterLeasingContract(input: {
    employerId: "EMP-4711"
    lessorId: "LESSOR-1"
    creditLimit: "10000"
    contractType: "salary-sacrifice-leasing"
    currency: "eur"
    eligibleEmployees: 5
  }) {
    masterLeasingContractId
    status
  }
}

# --- Error: BAD_REQUEST — malformed decimal. ----------------------------------------------
# Rejected at the adapter, before the value becomes a domain type at all. It arrives as an
# IllegalArgumentException and is mapped by the § 6.3 backstop every exception resolver
# carries — the same route as an identifier that is not a UUID. Not a § 2.3 rule.
mutation CreateMasterLeasingContractMalformedDecimal {
  createMasterLeasingContract(input: {
    employerId: "EMP-4711"
    lessorId: "LESSOR-1"
    creditLimit: "fifty thousand"
    contractType: "salary-sacrifice-leasing"
    currency: "EUR"
    eligibleEmployees: 5
  }) {
    masterLeasingContractId
    status
  }
}

# --- Not requestable: INTERNAL_ERROR. -----------------------------------------------------
# § 9 lists two classifications and asks for one request per classification. This file has
# seven requests and none of them produces INTERNAL_ERROR, because none can: it requires an
# actual persistence failure, not a malformed input. There is no request a client can send that
# makes the database fail.
#
# Recorded rather than left as a silent hole. `conformance-reviewer` found the omission by
# walking § 9's list against this file, and the omission was mine — the NOT_FOUND note below
# already explained *its* absence, so a reader had no way to tell whether INTERNAL_ERROR was
# forgotten or impossible. An absence nobody wrote down reads as verified (`HANDOFF.md` § 11).
#
# The classification is exercised where it can be: `MlcGraphQLExceptionResolverTest` asserts
# that an arbitrary non-domain exception falls through to Spring's default handling, which is
# what produces INTERNAL_ERROR. § 8's rollback half belongs to the persistence layer.

# --- Not applicable: NOT_FOUND. ------------------------------------------------------------
# There is no request that produces it, which is the point of saying so here. This operation
# creates rather than loads, verifies no participant (PD-06) and resolves no parent (PD-04).
#
# Nor is there a conflict request: PD-05 permits one employer to hold several active
# contracts. If that is overturned, GraphQL has no CONFLICT classification and the case would
# collapse into BAD_REQUEST — an asymmetry uc07 § 9 records in the contract rather than
# leaving to a support conversation.
